openapi: 3.0.3
info:
  title: AIDD Task API
  version: 0.1.0
  description: Task API used throughout the course.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Application health
      responses:
        '200':
          description: Healthy
  /api/tasks:
    get:
      summary: List tasks for the current user
      responses:
        '200':
          description: Task list
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created
  /api/tasks/{id}:
    put:
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
components:
  schemas:
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
