services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aidd
      POSTGRES_USER: aidd
      POSTGRES_PASSWORD: aidd-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidd -d aidd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
